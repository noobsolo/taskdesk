[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "taskdeck"
version = "0.1.0"
description = "Manual-first Git task and Codex session dashboard"
requires-python = ">=3.12"
dependencies = ["textual>=6,<9", "PyYAML>=6,<7", "pyte>=0.8.2,<0.9", "websockets>=15,<17"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.24,<2"]

[project.scripts]
taskdeck = "taskdeck.cli:main"

[tool.setuptools.packages.find]
include = ["taskdeck*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
